<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#173f5f">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/icon.svg">
<title>RentaControl</title>
<style>body{font-family:system-ui,-apple-system,Segoe UI,sans-serif;margin:0;background:#f4f7fa;color:#1c2733;display:grid;place-items:center;min-height:100vh}.box{background:white;border:1px solid #dde5ec;border-radius:18px;padding:28px;max-width:480px;box-shadow:0 10px 30px rgba(22,45,67,.08)}.muted{color:#6c7885;font-size:14px}</style>
<div class="box"><strong>Cargando RentaControl…</strong><p class="muted">Conectando con tu información segura.</p><div id="err" class="muted"></div></div>
<script>
(async()=>{
 try{
   const files=Array.from({length:13},(_,i)=>`./payload/p${String(i).padStart(2,'0')}.txt`);
   const parts=await Promise.all(files.map(f=>fetch(f,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(f+' '+r.status);return r.text()})));
   const encoded=parts.join('');
   const bytes=Uint8Array.from(atob(encoded),c=>c.charCodeAt(0));
   if(!('DecompressionStream' in window)) throw new Error('Este navegador necesita una versión más reciente para abrir RentaControl.');
   let html=await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).text();

   // Hotfix 4.2.1: nunca enviar inmuebles con clave vacía.
   html=html.replace(
     "id:p.id,user_id:cloudUser.id,code:p.code||'',name:p.name||'',property_type:(p.type||'Departamento').toLowerCase(),",
     "id:p.id,user_id:cloudUser.id,code:String(p.code||p.name||'INMUEBLE').trim()||'INMUEBLE',name:p.name||'',property_type:(p.type||'Departamento').toLowerCase(),"
   );

   // Hotfix 4.2.1: reparar claves vacías antes de cualquier sincronización.
   html=html.replace(
     "try{\n    const snap=cloneJson(state), shadow=cloudShadow||{properties:[],tenants:[],leases:[],charges:[],payments:[],expenses:[],deposits:[],documents:[],settings:{}};",
     "try{\n    state.properties.forEach(p=>{if(!String(p.code||'').trim())p.code=String(p.name||'INMUEBLE').trim()||'INMUEBLE';});\n    const snap=cloneJson(state), shadow=cloudShadow||{properties:[],tenants:[],leases:[],charges:[],payments:[],expenses:[],deposits:[],documents:[],settings:{}};"
   );

   // Hotfix 4.2.1: recuperar la prueba local que quedó pendiente por el error de clave vacía.
   html=html.replace(
     "try{const remote=await cloudFetchAll();cloudApplyRemote(remote);cloudReady=true;cloudSetStatus('ok','Sincronizado');render();}",
     `try{
       let remote=await cloudFetchAll(),recovered=0;
       const cachedRaw=safeGet(cloudCacheKey());
       if(cachedRaw){
         try{
           const cached=JSON.parse(cachedRaw);
           if((cached.properties||[]).some(p=>!String(p.code||'').trim())){
             for(const key of ['properties','tenants','leases','charges','payments','expenses','deposits','documents']){
               const dest=Array.isArray(remote[key])?remote[key]:[],ids=new Set(dest.map(x=>x.id));
               for(const row of (cached[key]||[])){if(row&&row.id&&!ids.has(row.id)){dest.push(row);ids.add(row.id);recovered++;}}
               remote[key]=dest;
             }
             (remote.properties||[]).forEach(p=>{if(!String(p.code||'').trim())p.code=String(p.name||'INMUEBLE').trim()||'INMUEBLE';});
           }
         }catch(_){}
       }
       cloudApplyRemote(remote);cloudReady=true;
       if(recovered){
         cloudDirty=true;cloudSetStatus('busy','Recuperando cambios…');render();
         const ok=await cloudSyncNow();
         if(ok){await cloudPullState(true);toast('Se recuperaron y sincronizaron los cambios pendientes de la prueba.');}
         else toast('Se recuperaron los cambios locales, pero aún falta sincronizarlos.');
       }else{cloudSetStatus('ok','Sincronizado');render();}
     }`
   );

   // Hotfix 4.2.1: la clave/número es obligatoria para inmuebles nuevos o editados.
   html=html.replace(
     "const name=v('propName').trim();if(!name)return toast('Captura un nombre para el inmueble.');\n  const obj={name,code:v('propCode'),type:v('propType'),furnishing:v('propFurnishing'),status:v('propStatus'),address:v('propAddress'),notes:v('propNotes')};",
     "const name=v('propName').trim();if(!name)return toast('Captura un nombre para el inmueble.');\n  const code=String(v('propCode')||'').trim();if(!code)return toast('Captura una clave o número para el inmueble.');\n  const duplicate=state.properties.some(x=>x.id!==p?.id&&String(x.code||'').trim().toLowerCase()===code.toLowerCase());if(duplicate)return toast('Ya existe otro inmueble con esa clave o número.');\n  const obj={name,code,type:v('propType'),furnishing:v('propFurnishing'),status:v('propStatus'),address:v('propAddress'),notes:v('propNotes')};"
   );

   document.open();document.write(html);document.close();
 }catch(e){document.getElementById('err').textContent='No se pudo cargar RentaControl. Recarga la página. Detalle: '+(e&&e.message||e);}
})();
</script>
