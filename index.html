<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#173f5f">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/icon.svg">
<title>RentaControl</title>
<style>body{font-family:system-ui,-apple-system,Segoe UI,sans-serif;margin:0;background:#f4f7fa;color:#1c2733;display:grid;place-items:center;min-height:100vh}.box{background:white;border:1px solid #dde5ec;border-radius:18px;padding:28px;max-width:480px;box-shadow:0 10px 30px rgba(22,45,67,.08)}.muted{color:#6c7885;font-size:14px}</style>
<div class="box"><strong>Cargando RentaControl…</strong><p class="muted">Conectando con tu información segura.</p><div id="err" class="muted"></div></div>
<script>
(async()=>{
 try{
   const files=Array.from({length:13},(_,i)=>`./payload/p${String(i).padStart(2,'0')}.txt`);
   const parts=await Promise.all(files.map(f=>fetch(f,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(f+' '+r.status);return r.text()})));
   const encoded=parts.join('');
   const bytes=Uint8Array.from(atob(encoded),c=>c.charCodeAt(0));
   if(!('DecompressionStream' in window)) throw new Error('Este navegador necesita una versión más reciente para abrir RentaControl.');
   const html=await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
   document.open();document.write(html);document.close();
 }catch(e){document.getElementById('err').textContent='No se pudo cargar RentaControl. Recarga la página. Detalle: '+(e&&e.message||e);}
})();
</script>
